<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("pf-theme")||"dark");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit a Prompt — PromptForge</title>
  <meta name="description" content="Share your best AI prompts with the PromptForge community.">
  <link rel="stylesheet" href="./css/global.css">
  <style>
    body { display: flex; flex-direction: column; }
    .submit-wrap { max-width: 680px; margin: 0 auto; width: 100%; padding: 3rem 1.5rem; flex: 1; }
    .submit-header { margin-bottom: 2.5rem; text-align: center; }
    .submit-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2.25rem; }
    .char-counter { font-size: 0.75rem; color: var(--text-muted); text-align: right; margin-top: 0.25rem; }
    .char-counter.warn { color: #fb923c; }
    .success-card { background: var(--card); border: 1px solid rgba(34,197,94,0.2); border-radius: var(--radius-lg); padding: 3rem; text-align: center; }
  </style>
</head>
<body>
<div class="page-wrap">
  <div id="navbar-container"></div>

  <div class="submit-wrap animate-fade-up">
    <div class="submit-header">
      <h1 style="font-size:2rem;font-weight:800;letter-spacing:-0.03em;">Submit a Prompt</h1>
      <p style="color:var(--text-muted);margin-top:0.5rem;font-size:0.9375rem;">Share your best prompts with the community. Our team reviews all submissions.</p>
    </div>

    
    <div id="success-card" class="success-card" style="display:none;">
      <div style="font-size:3.5rem;margin-bottom:1.25rem;">🎉</div>
      <h2 style="font-size:1.375rem;font-weight:700;color:#4ade80;margin-bottom:0.75rem;">Submission received!</h2>
      <p style="color:var(--text-muted);font-size:0.9rem;max-width:320px;margin:0 auto 1.75rem;">Our team will review your prompt and publish it shortly. Thank you for contributing!</p>
      <button onclick="document.getElementById('success-card').style.display='none';document.getElementById('form-card').style.display='block';" class="btn btn-secondary">Submit another</button>
    </div>

    
    <div id="form-card" class="submit-card">
      <form id="submit-form" novalidate style="display:flex;flex-direction:column;gap:1.375rem;">
        <div class="field">
          <label class="label" for="sub-title">Prompt Title *</label>
          <input id="sub-title" type="text" class="input" placeholder="e.g. Cinematic Portrait at Golden Hour" required maxlength="100">
          <div class="char-counter" id="title-counter">0 / 100</div>
        </div>

        <div class="field">
          <label class="label" for="sub-prompt">Prompt Text *</label>
          <textarea id="sub-prompt" class="input" rows="6" placeholder="Paste your full prompt here..." required maxlength="5000"></textarea>
          <div class="char-counter" id="prompt-counter">0 / 5000</div>
        </div>

        <div class="field">
          <label class="label" for="sub-description">Short Description</label>
          <input id="sub-description" type="text" class="input" placeholder="One sentence about what this prompt creates..." maxlength="200">
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <div class="field">
            <label class="label" for="sub-difficulty">Difficulty</label>
            <select id="sub-difficulty" class="input">
              <option value="beginner">Beginner</option>
              <option value="intermediate" selected>Intermediate</option>
              <option value="advanced">Advanced</option>
            </select>
          </div>
          <div class="field">
            <label class="label" for="sub-type">Type</label>
            <select id="sub-type" class="input">
              <option value="text-to-image">Text to Image</option>
              <option value="text-to-text">Text to Text</option>
              <option value="text-to-video">Text to Video</option>
            </select>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <div class="field">
            <label class="label" for="sub-tags">Tags <span style="color:var(--text-muted);font-weight:400;">(comma-separated)</span></label>
            <input id="sub-tags" type="text" class="input" placeholder="portrait, cinematic, realistic, 4k">
          </div>
          <div class="field">
            <label class="label" for="sub-tools">Supported Tools <span style="color:var(--text-muted);font-weight:400;">(comma-separated)</span></label>
            <input id="sub-tools" type="text" class="input" placeholder="Midjourney, DALL-E, Stable Diffusion">
          </div>
        </div>

        <div class="field">
          <label class="label" for="sub-category">Category</label>
          <select id="sub-category" class="input">
            <option value="">Select a Category</option>
          </select>
        </div>

        <div>
          <p id="form-error" style="color:#f87171;font-size:0.8125rem;margin-bottom:0.75rem;display:none;"></p>
          <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width:100%;">Submit for Review</button>
          <p style="text-align:center;font-size:0.78rem;color:var(--text-muted);margin-top:1rem;">By submitting, you confirm this is original or properly credited content.</p>
        </div>
      </form>
    </div>
  </div>

  <div id="footer-container"></div>
</div>

<script type="module" src="./js/pages/submit.js"></script>
<script type="module" src="./js/theme.js"></script>
</body>
</html>
