<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("pf-theme")||"dark");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — PromptForge</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/global.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; }
    .auth-card  { width: 100%; max-width: 400px; }
    .auth-header { text-align: center; margin-bottom: 2rem; }
    .auth-box { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2.25rem; }
    .error-text   { color: #f87171; font-size: 0.8125rem; min-height: 1.25rem; text-align: center; }
    .pw-wrap { position: relative; }
    .pw-toggle { position: absolute; right: 0.875rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; transition: color var(--transition); padding: 0; display: flex; }
    .pw-toggle:hover { color: var(--text); }
    .strength-bar  { height: 3px; border-radius: 99px; background: var(--border-2); margin-top: 0.5rem; overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 99px; transition: width 0.3s ease, background 0.3s ease; width: 0%; }
  </style>
</head>
<body>

<div style="position:fixed;inset:0;background:radial-gradient(ellipse at 70% 20%, rgba(108,63,232,0.1) 0%, transparent 60%);pointer-events:none;"></div>

<div class="auth-card animate-fade-up">
  <div class="auth-header">
    <a href="/" class="logo" style="display:inline-flex;justify-content:center;margin-bottom:1rem;">
      <div class="logo-icon" style="width:40px;height:40px;font-size:1.25rem;">✨</div>
    </a>
    <h1 style="font-size:1.5rem;font-weight:800;letter-spacing:-0.03em;">Set new password</h1>
    <p style="color:var(--text-muted);font-size:0.875rem;margin-top:0.375rem;">Choose a strong password for your account.</p>
  </div>

  <div class="auth-box">
    <!-- Error: invalid/expired link -->
    <div id="invalid-msg" style="display:none;text-align:center;padding:1rem;">
      <div style="font-size:2rem;margin-bottom:0.75rem;">⚠️</div>
      <p style="color:#f87171;font-weight:600;margin-bottom:0.5rem;">Invalid or expired link</p>
      <p style="color:var(--text-muted);font-size:0.875rem;margin-bottom:1rem;">This link may have expired. Request a new one.</p>
      <a href="/forgot-password.html" class="btn btn-primary btn-sm">Request New Link</a>
    </div>

    <!-- Success state -->
    <div id="success-msg" style="display:none;text-align:center;padding:1rem;">
      <div style="font-size:2.5rem;margin-bottom:0.75rem;">✅</div>
      <p style="color:#4ade80;font-weight:600;margin-bottom:0.5rem;">Password updated!</p>
      <p style="color:var(--text-muted);font-size:0.875rem;margin-bottom:1rem;">You can now sign in with your new password.</p>
      <a href="/login.html" class="btn btn-primary btn-sm">Sign In</a>
    </div>

    <!-- Reset form -->
    <form id="reset-form" novalidate style="display:flex;flex-direction:column;gap:1.25rem;">
      <div class="field">
        <label class="label" for="password">New password</label>
        <div class="pw-wrap">
          <input id="password" type="password" class="input" style="padding-right:2.75rem;" placeholder="Min. 8 characters" autocomplete="new-password" required minlength="8">
          <button type="button" id="toggle-pw" class="pw-toggle" aria-label="Toggle password">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7s-8.268-2.943-9.542-7z"/></svg>
          </button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
        <div id="strength-label" style="font-size:0.72rem;color:var(--text-muted);margin-top:0.2rem;"></div>
      </div>
      <div class="field">
        <label class="label" for="confirm-password">Confirm new password</label>
        <input id="confirm-password" type="password" class="input" placeholder="Re-enter password" autocomplete="new-password" required>
      </div>
      <p id="error-msg" class="error-text"></p>
      <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width:100%;">Update Password</button>
    </form>
  </div>
</div>

<script type="module">
  import { getClient } from '/js/auth.js';
  import { setButtonLoading } from '/js/core.js';

  const form       = document.getElementById('reset-form');
  const passEl     = document.getElementById('password');
  const confirmEl  = document.getElementById('confirm-password');
  const errorMsg   = document.getElementById('error-msg');
  const submitBtn  = document.getElementById('submit-btn');
  const toggleBtn  = document.getElementById('toggle-pw');
  const fillEl     = document.getElementById('strength-fill');
  const labelEl    = document.getElementById('strength-label');
  const invalidMsg = document.getElementById('invalid-msg');
  const successMsg = document.getElementById('success-msg');

  // Verify Supabase token in URL hash (Supabase puts it there after email click)
  const sb = await getClient();
  const { data: { session } } = await sb.auth.getSession();

  // If no session from hash, show invalid link message
  if (!session) {
    form.style.display = 'none';
    invalidMsg.style.display = 'block';
  }

  // Password toggle
  toggleBtn.addEventListener('click', () => {
    const hidden = passEl.type === 'password';
    passEl.type = hidden ? 'text' : 'password';
    toggleBtn.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
  });

  // Strength meter
  passEl.addEventListener('input', () => {
    const v = passEl.value;
    let score = 0;
    if (v.length >= 8)  score++;
    if (v.length >= 12) score++;
    if (/[A-Z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;
    const levels = [
      { pct: '0%',   color: 'transparent', label: '' },
      { pct: '25%',  color: '#f87171',     label: 'Weak' },
      { pct: '50%',  color: '#fb923c',     label: 'Fair' },
      { pct: '75%',  color: '#facc15',     label: 'Good' },
      { pct: '100%', color: '#4ade80',     label: 'Strong' },
    ];
    const lvl = levels[Math.min(score, 4)];
    fillEl.style.width = lvl.pct;
    fillEl.style.background = lvl.color;
    labelEl.textContent = lvl.label;
    labelEl.style.color = lvl.color;
  });

  [passEl, confirmEl].forEach(el => el.addEventListener('input', () => { errorMsg.textContent = ''; }));

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.textContent = '';
    const password = passEl.value;
    const confirm  = confirmEl.value;
    if (password.length < 8)   { errorMsg.textContent = 'Password must be at least 8 characters.'; return; }
    if (password !== confirm)   { errorMsg.textContent = 'Passwords do not match.'; return; }

    const restore = setButtonLoading(submitBtn, 'Updating…');
    try {
      const { error } = await sb.auth.updateUser({ password });
      if (error) throw error;
      form.style.display = 'none';
      successMsg.style.display = 'block';
      await sb.auth.signOut();
    } catch (err) {
      errorMsg.textContent = err.message || 'Failed to update password.';
      restore();
    }
  });
</script>
<script type="module" src="/js/theme.js"></script>
</body>
</html>
