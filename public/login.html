<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("pf-theme")||"dark");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — PromptForge</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/global.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; }
    .login-card { width: 100%; max-width: 400px; }
    .login-header { text-align: center; margin-bottom: 2rem; }
    .login-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
    }
    .error-text { color: #f87171; font-size: 0.8125rem; min-height: 1.25rem; text-align: center; }
    .pw-wrap { position: relative; }
    .pw-toggle {
      position: absolute; right: 0.875rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-muted); cursor: pointer;
      transition: color var(--transition); padding: 0; display: flex;
    }
    .pw-toggle:hover { color: #fff; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
  </style>
</head>
<body>

<div style="position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%, rgba(108,63,232,0.12) 0%, transparent 60%);pointer-events:none;"></div>

<div class="login-card animate-fade-up">
  <div class="login-header">
    <a href="/" class="logo" style="display:inline-flex;justify-content:center;margin-bottom:1rem;">
      <div class="logo-icon" style="width:40px;height:40px;font-size:1.25rem;">✨</div>
    </a>
    <h1 style="font-size:1.5rem;font-weight:800;letter-spacing:-0.03em;">Welcome back</h1>
    <p style="color:var(--text-muted);font-size:0.875rem;margin-top:0.375rem;">Sign in to the admin dashboard</p>
  </div>

  <div class="login-box">
    <form id="login-form" novalidate style="display:flex;flex-direction:column;gap:1.25rem;">
      <div class="field">
        <label class="label" for="email">Email address</label>
        <input id="email" type="email" class="input" placeholder="admin@example.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label class="label" for="password">Password</label>
        <div class="pw-wrap">
          <input id="password" type="password" class="input" style="padding-right:2.75rem;" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" id="toggle-pw" class="pw-toggle" aria-label="Toggle password">
            <svg id="eye-show" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7s-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
      </div>

      <p id="error-msg" class="error-text"></p>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width:100%;">Sign in</button>
      <p style="text-align:center;font-size:0.8125rem;color:var(--text-muted);margin-top:-0.25rem;">
        <a href="/forgot-password.html" style="color:var(--text-muted);text-decoration:none;transition:color var(--transition);" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-muted)'">Forgot your password?</a>
      </p>
    </form>

    <hr class="divider">
    <p style="text-align:center;font-size:0.8125rem;color:var(--text-muted);">
      Don't have an account?
      <a href="/signup.html" style="color:var(--primary);font-weight:600;text-decoration:none;">Sign up free</a>
    </p>
    <p style="text-align:center;font-size:0.8125rem;color:var(--text-muted);margin-top:0.75rem;">
      <a href="/" style="color:var(--text-muted);text-decoration:none;transition:color var(--transition);"
         onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-muted)'">
        ← Back to PromptForge
      </a>
    </p>
  </div>
</div>

<script type="module" src="/js/pages/login.js"></script>
<script type="module" src="/js/theme.js"></script>
</body>
</html>
