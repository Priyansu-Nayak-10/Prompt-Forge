<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("pf-theme")||"dark");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — PromptForge</title>
  <meta name="description" content="Browse AI prompts by category — portrait, landscape, fantasy, product photography and more.">
  <link rel="stylesheet" href="./css/global.css">
  <style>
    .cat-card {
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      text-decoration: none;
      color: inherit;
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
    }
    .cat-card::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, var(--border-hover), transparent 60%);
      opacity: 0; transition: opacity var(--transition);
    }
    .cat-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }
    .cat-card:hover::before { opacity: 1; }
    .cat-icon { font-size: 2.25rem; margin-bottom: 1rem; }
    .cat-name { font-size: 1rem; font-weight: 600; color: var(--text); transition: color var(--transition); }
    .cat-card:hover .cat-name { color: var(--text); }
    .cat-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.35rem; }
  </style>
</head>
<body>
<div class="page-wrap">
  <div id="navbar-container"></div>

  <div class="page-content">
    <div class="container">
      <div style="margin-bottom:2rem;">
        <h1 style="font-size:1.75rem;font-weight:800;letter-spacing:-0.03em;">Browse by Category</h1>
        <p style="color:var(--text-muted);margin-top:0.4rem;font-size:0.9rem;">Find exactly what you need, organized by creative style.</p>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.25rem;" id="categories-grid"></div>
    </div>
  </div>

  <div id="footer-container"></div>
</div>

<script type="module" src="./js/pages/discovery.js"></script>
<script type="module" src="./js/theme.js"></script>
</body>
</html>
