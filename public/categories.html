<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("pf-theme")||"dark");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — PromptForge</title>
  <meta name="description" content="Browse AI prompts by category — portrait, landscape, fantasy, product photography and more.">
  <link rel="stylesheet" href="./css/global.css">
  <style>
    .cat-card {
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      text-decoration: none;
      color: inherit;
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
    }
    .cat-card::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(108,63,232,0.08), transparent 60%);
      opacity: 0; transition: opacity var(--transition);
    }
    .cat-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(108,63,232,0.15);
    }
    .cat-card:hover::before { opacity: 1; }
    .cat-icon { font-size: 2.25rem; margin-bottom: 1rem; }
    .cat-name { font-size: 1rem; font-weight: 600; color: #fff; transition: color var(--transition); }
    .cat-card:hover .cat-name { color: #a78bfa; }
    .cat-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.35rem; }
  </style>
</head>
<body>
<div class="page-wrap">
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/" class="logo"><div class="logo-icon">✨</div>Prompt<span>Forge</span></a>
      <div class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/prompts.html" class="nav-link">Prompts</a>
        <a href="/categories.html" class="nav-link active">Categories</a>
        <a href="/tools.html" class="nav-link">Tools</a>
        <a href="/submit.html" class="nav-cta">Submit</a>
      </div>
        <button class="theme-toggle" aria-label="Toggle theme">
          <svg class="theme-icon-dark" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg class="theme-icon-light" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
    </div>
  </nav>

  <div class="page-content">
    <div class="container">
      <div style="margin-bottom:2rem;">
        <h1 style="font-size:1.75rem;font-weight:800;letter-spacing:-0.03em;">Browse by Category</h1>
        <p style="color:var(--text-muted);margin-top:0.4rem;font-size:0.9rem;">Find exactly what you need, organized by creative style.</p>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.25rem;" id="categories-grid"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <a href="/" class="logo" style="font-size:1rem;"><div class="logo-icon" style="width:26px;height:26px;font-size:0.85rem;">✨</div>Prompt<span>Forge</span></a>
      <span>© 2026 PromptForge. All rights reserved.</span>
    </div>
  </footer>
</div>

<script type="module">
  import { fetchCategories } from './js/api.js';
  const grid = document.getElementById('categories-grid');

  // Skeletons
  grid.innerHTML = Array(8).fill(`
    <div class="cat-card" style="pointer-events:none;">
      <div class="skeleton" style="width:44px;height:44px;border-radius:8px;margin-bottom:1rem;"></div>
      <div class="skeleton" style="height:16px;width:60%;margin-bottom:0.5rem;"></div>
      <div class="skeleton" style="height:12px;width:40%;"></div>
    </div>
  `).join('');

  try {
    const res = await fetchCategories();
    const cats = res?.data || [];
    if (!cats.length) {
      grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:5rem;color:var(--text-muted)">No categories found.</div>`;
    } else {
      grid.innerHTML = cats.map((cat, i) => `
        <a href="/prompts.html?category=${cat.id}" class="cat-card animate-fade-up" style="animation-delay:${i * 0.04}s;">
          <div class="cat-icon">${cat.icon || '🎨'}</div>
          <div class="cat-name">${cat.name}</div>
          <div class="cat-sub">Browse prompts →</div>
        </a>
      `).join('');
    }
  } catch {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:3rem;color:#f87171;">Failed to load categories.</div>`;
  }
</script>
<script type="module" src="./js/theme.js"></script>
</body>
</html>
