<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("pf-theme")||"dark");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — PromptForge</title>
  <meta name="description" content="Join PromptForge and start saving your favourite AI prompts.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/global.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; }
    .auth-card  { width: 100%; max-width: 420px; }
    .auth-header { text-align: center; margin-bottom: 2rem; }
    .auth-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
    }
    .error-text   { color: #f87171; font-size: 0.8125rem; min-height: 1.25rem; text-align: center; }
    .success-text { color: #4ade80; font-size: 0.875rem; text-align: center; padding: 0.75rem; background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2); border-radius: var(--radius-sm); }
    .pw-wrap { position: relative; }
    .pw-toggle {
      position: absolute; right: 0.875rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-muted); cursor: pointer;
      transition: color var(--transition); padding: 0; display: flex;
    }
    .pw-toggle:hover { color: var(--text); }
    .divider { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
    .strength-bar { height: 3px; border-radius: 99px; background: var(--border-2); margin-top: 0.5rem; overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 99px; transition: width 0.3s ease, background 0.3s ease; width: 0%; }
  </style>
</head>
<body>

<div style="position:fixed;inset:0;background:radial-gradient(ellipse at 70% 20%, rgba(108,63,232,0.12) 0%, transparent 60%);pointer-events:none;"></div>

<div class="auth-card animate-fade-up">
  <div class="auth-header">
    <a href="/" class="logo" style="display:inline-flex;justify-content:center;margin-bottom:1rem;">
      <div class="logo-icon" style="width:40px;height:40px;font-size:1.25rem;">✨</div>
    </a>
    <h1 style="font-size:1.5rem;font-weight:800;letter-spacing:-0.03em;">Create your account</h1>
    <p style="color:var(--text-muted);font-size:0.875rem;margin-top:0.375rem;">Join PromptForge for free</p>
  </div>

  <div class="auth-box">
    
    <div id="success-msg" style="display:none;">
      <div class="success-text">
        ✓ Account created! Check your email to confirm your address, then <a href="/login.html" style="color:#4ade80;font-weight:600;">sign in</a>.
      </div>
    </div>

    
    <form id="signup-form" novalidate style="display:flex;flex-direction:column;gap:1.25rem;">
      <div class="field">
        <label class="label" for="email">Email address</label>
        <input id="email" type="email" class="input" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label class="label" for="password">Password</label>
        <div class="pw-wrap">
          <input id="password" type="password" class="input" style="padding-right:2.75rem;" placeholder="Min. 8 characters" autocomplete="new-password" required minlength="8">
          <button type="button" id="toggle-pw" class="pw-toggle" aria-label="Toggle password">
            <svg id="eye-icon" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7s-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
        
        <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
        <div id="strength-label" style="font-size:0.72rem;color:var(--text-muted);margin-top:0.2rem;"></div>
      </div>

      <div class="field">
        <label class="label" for="confirm-password">Confirm password</label>
        <input id="confirm-password" type="password" class="input" placeholder="Re-enter password" autocomplete="new-password" required>
      </div>

      <p id="error-msg" class="error-text"></p>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width:100%;">Create Account</button>
    </form>

    <hr class="divider">
    <p style="text-align:center;font-size:0.8125rem;color:var(--text-muted);">
      Already have an account?
      <a href="/login.html" style="color:var(--primary);font-weight:600;text-decoration:none;">Sign in</a>
    </p>
    <p style="text-align:center;font-size:0.8125rem;color:var(--text-muted);margin-top:0.75rem;">
      <a href="/" style="color:var(--text-muted);text-decoration:none;transition:color var(--transition);"
         onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-muted)'">← Back to PromptForge</a>
    </p>
  </div>
</div>

<script type="module">
  import { signUp, redirectIfLoggedIn } from '/js/auth.js';
  import { setButtonLoading } from '/js/core.js';

  // Redirect if already signed in
  await redirectIfLoggedIn('/');

  const form        = document.getElementById('signup-form');
  const emailEl     = document.getElementById('email');
  const passEl      = document.getElementById('password');
  const confirmEl   = document.getElementById('confirm-password');
  const errorMsg    = document.getElementById('error-msg');
  const submitBtn   = document.getElementById('submit-btn');
  const toggleBtn   = document.getElementById('toggle-pw');
  const successMsg  = document.getElementById('success-msg');
  const strengthFill = document.getElementById('strength-fill');
  const strengthLabel = document.getElementById('strength-label');

  // Toggle password visibility
  toggleBtn.addEventListener('click', () => {
    const hidden = passEl.type === 'password';
    passEl.type = hidden ? 'text' : 'password';
    toggleBtn.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
  });

  // Password strength meter
  passEl.addEventListener('input', () => {
    const v = passEl.value;
    let score = 0;
    if (v.length >= 8)  score++;
    if (v.length >= 12) score++;
    if (/[A-Z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;

    const levels = [
      { pct: '0%',   color: 'transparent', label: '' },
      { pct: '25%',  color: '#f87171',     label: 'Weak' },
      { pct: '50%',  color: '#fb923c',     label: 'Fair' },
      { pct: '75%',  color: '#facc15',     label: 'Good' },
      { pct: '100%', color: '#4ade80',     label: 'Strong' },
    ];
    const lvl = levels[Math.min(score, 4)];
    strengthFill.style.width = lvl.pct;
    strengthFill.style.background = lvl.color;
    strengthLabel.textContent = lvl.label;
    strengthLabel.style.color = lvl.color;
  });

  // Clear error on type
  [emailEl, passEl, confirmEl].forEach(el => el.addEventListener('input', () => { errorMsg.textContent = ''; }));

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.textContent = '';

    const email    = emailEl.value.trim();
    const password = passEl.value;
    const confirm  = confirmEl.value;

    if (!email || !password) { errorMsg.textContent = 'Please fill in all fields.'; return; }
    if (password.length < 8) { errorMsg.textContent = 'Password must be at least 8 characters.'; return; }
    if (password !== confirm)  { errorMsg.textContent = 'Passwords do not match.'; return; }

    const restore = setButtonLoading(submitBtn, 'Creating account...');
    try {
      await signUp(email, password);
      form.style.display = 'none';
      successMsg.style.display = 'block';
    } catch (err) {
      errorMsg.textContent = err.message || 'Sign up failed. Please try again.';
      restore();
    }
  });
</script>
<script type="module" src="/js/theme.js"></script>
</body>
</html>
