<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("pf-theme")||"dark");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — PromptForge</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/global.css?v=2.0">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; }
    .auth-card  { width: 100%; max-width: 400px; }
    .auth-header { text-align: center; margin-bottom: 2rem; }
    .auth-box { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2.25rem; }
    .error-text   { color: #f87171; font-size: 0.8125rem; min-height: 1.25rem; text-align: center; }
    .success-box  { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2); border-radius: var(--radius); padding: 1.5rem; text-align: center; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
  </style>
</head>
<body>

<div style="position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%, rgba(108,63,232,0.1) 0%, transparent 60%);pointer-events:none;"></div>

<div class="auth-card animate-fade-up">
  <div class="auth-header">
    <a href="/" class="logo" style="display:inline-flex;justify-content:center;margin-bottom:1rem;">
      <div class="logo-icon" style="width:40px;height:40px;font-size:1.25rem;">✨</div>
    </a>
    <h1 style="font-size:1.5rem;font-weight:800;letter-spacing:-0.03em;">Reset your password</h1>
    <p style="color:var(--text-muted);font-size:0.875rem;margin-top:0.375rem;">Enter your email and we'll send you a reset link.</p>
  </div>

  <div class="auth-box">
    <div id="success-msg" style="display:none;" class="success-box">
      <div style="font-size:2rem;margin-bottom:0.75rem;">📬</div>
      <p style="color:#4ade80;font-weight:600;margin-bottom:0.5rem;">Check your inbox</p>
      <p style="color:var(--text-muted);font-size:0.875rem;">A password reset link has been sent to your email. It expires in 1 hour.</p>
    </div>

    <form id="reset-form" novalidate style="display:flex;flex-direction:column;gap:1.25rem;">
      <div class="field">
        <label class="label" for="email">Email address</label>
        <input id="email" type="email" class="input" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <p id="error-msg" class="error-text"></p>
      <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width:100%;">Send Reset Link</button>
    </form>

    <hr class="divider">
    <p style="text-align:center;font-size:0.8125rem;color:var(--text-muted);">
      <a href="/login.html" style="color:var(--primary);font-weight:600;text-decoration:none;">← Back to Sign In</a>
    </p>
  </div>
</div>

<script type="module">
  import { getClient, redirectIfLoggedIn } from '/js/auth.js';
  import { setButtonLoading } from '/js/core.js';

  await redirectIfLoggedIn('/');

  const form      = document.getElementById('reset-form');
  const emailEl   = document.getElementById('email');
  const errorMsg  = document.getElementById('error-msg');
  const submitBtn = document.getElementById('submit-btn');
  const successEl = document.getElementById('success-msg');

  emailEl.addEventListener('input', () => { errorMsg.textContent = ''; });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.textContent = '';
    const email = emailEl.value.trim();
    if (!email) { errorMsg.textContent = 'Please enter your email address.'; return; }

    const restore = setButtonLoading(submitBtn, 'Sending…');
    try {
      const sb = await getClient();
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: `${window.location.origin}/reset-password.html`,
      });
      if (error) throw error;
      form.style.display = 'none';
      successEl.style.display = 'block';
    } catch (err) {
      errorMsg.textContent = err.message || 'Failed to send reset email. Please try again.';
      restore();
    }
  });
</script>
<script type="module" src="/js/theme.js?v=3.0"></script>
</body>
</html>
