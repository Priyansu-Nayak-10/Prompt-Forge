<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("pf-theme")||"dark");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Details — PromptForge</title>
  <meta name="description" content="View the full prompt, copy it, and save it to your collection on PromptForge.">
  <meta property="og:type" content="article">
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <link rel="stylesheet" href="/css/global.css?v=2.0">
  <style>
    .detail-hero {
      width: 100%;
      height: 420px;
      object-fit: cover;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      display: block;
      margin-bottom: 2rem;
    }
    .detail-hero-placeholder {
      height: 280px;
      background: linear-gradient(135deg, #0D0D1A 0%, #1A1A2E 100%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      margin-bottom: 2rem;
    }
    .prompt-box {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      position: relative;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      line-height: 1.75;
      color: #e0e0ff;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .prompt-box-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 1rem;
      font-family: 'Inter', sans-serif;
    }
    .copy-prompt-btn {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.875rem;
      background: linear-gradient(135deg, #6C3FE8, #8b5cf6);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.8125rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: 0 2px 12px rgba(108,63,232,0.35);
    }
    .copy-prompt-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108,63,232,0.5); opacity: 0.9; }
    .negative-box {
      background: rgba(239,68,68,0.05);
      border: 1px solid rgba(239,68,68,0.12);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      line-height: 1.65;
      color: #fca5a5;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 1rem;
    }
    .tag-pill {
      display: inline-flex;
      align-items: center;
      padding: 0.3rem 0.75rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 99px;
      font-size: 0.78rem;
      color: var(--text-subtle);
      font-weight: 500;
    }
    .meta-row { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; margin: 1rem 0 1.5rem; }
    .meta-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8125rem; color: var(--text-muted); }
  </style>
</head>
<body>
<div class="page-wrap">

  <div id="navbar-container"></div>

  <div class="page-content">
    <div class="container" style="max-width:860px;">
      <a href="/prompts.html" style="display:inline-flex;align-items:center;gap:0.375rem;color:var(--text-muted);font-size:0.875rem;text-decoration:none;margin-bottom:1.75rem;transition:color var(--transition);"
         onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-muted)'">
        ← Back to prompts
      </a>

      <div id="prompt-content" class="animate-fade-up"></div>
    </div>
  </div>

  <div id="footer-container"></div>
</div>
<script type="module" src="/js/pages/detail.js"></script>
<script type="module" src="/js/theme.js"></script>
</body>
</html>
