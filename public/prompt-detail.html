<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("pf-theme")||"dark");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Details — PromptForge</title>
  <meta name="description" content="View the full prompt, copy it, and save it to your collection on PromptForge.">
  <meta property="og:type" content="article">
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <link rel="stylesheet" href="/css/global.css?v=2.0">
  <style>
    .detail-hero {
      width: 100%;
      height: 420px;
      object-fit: cover;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      display: block;
      margin-bottom: 2rem;
    }
    .detail-hero-placeholder {
      height: 280px;
      background: linear-gradient(135deg, #0D0D1A 0%, #1A1A2E 100%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      margin-bottom: 2rem;
    }
    .prompt-box {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      position: relative;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      line-height: 1.75;
      color: #e0e0ff;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .prompt-box-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 1rem;
      font-family: 'Inter', sans-serif;
    }
    .copy-prompt-btn {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.875rem;
      background: linear-gradient(135deg, #6C3FE8, #8b5cf6);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.8125rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: 0 2px 12px rgba(108,63,232,0.35);
    }
    .copy-prompt-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108,63,232,0.5); opacity: 0.9; }
    .negative-box {
      background: rgba(239,68,68,0.05);
      border: 1px solid rgba(239,68,68,0.12);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      line-height: 1.65;
      color: #fca5a5;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 1rem;
    }
    .tag-pill {
      display: inline-flex;
      align-items: center;
      padding: 0.3rem 0.75rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 99px;
      font-size: 0.78rem;
      color: var(--text-subtle);
      font-weight: 500;
    }
    .meta-row { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; margin: 1rem 0 1.5rem; }
    .meta-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8125rem; color: var(--text-muted); }
  </style>
</head>
<body>
<div class="page-wrap">

  <div id="navbar-container"></div>

  <div class="page-content">
    <div class="container" style="max-width:860px;">
      <a href="/prompts.html" style="display:inline-flex;align-items:center;gap:0.375rem;color:var(--text-muted);font-size:0.875rem;text-decoration:none;margin-bottom:1.75rem;transition:color var(--transition);"
         onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-muted)'">
        ← Back to prompts
      </a>

      <div id="prompt-content" class="animate-fade-up"></div>

      <!-- Reviews Section -->
      <section id="reviews-section" class="animate-fade-up" style="margin-top:4rem;padding-top:3rem;border-top:1px solid var(--border);">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;">
          <h2 style="font-size:1.5rem;font-weight:800;">Community Reviews</h2>
          <div id="avg-rating" style="display:flex;align-items:center;gap:0.5rem;font-weight:700;color:#fbbf24;"></div>
        </div>
        
        <div id="review-form-container" style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.75rem;margin-bottom:2.5rem;display:none;">
          <h3 style="font-size:1rem;margin-bottom:1.25rem;">Write a Review</h3>
          <form id="review-form">
            <div style="margin-bottom:1.25rem;">
              <label class="label">Rating</label>
              <div id="star-rating" style="display:flex;gap:0.5rem;margin-top:0.5rem;">
                <button type="button" class="star-btn" data-val="1">★</button>
                <button type="button" class="star-btn" data-val="2">★</button>
                <button type="button" class="star-btn" data-val="3">★</button>
                <button type="button" class="star-btn" data-val="4">★</button>
                <button type="button" class="star-btn" data-val="5">★</button>
              </div>
              <input type="hidden" id="rating-value" value="0">
            </div>
            <div style="margin-bottom:1.25rem;">
              <label class="label">Comment (Optional)</label>
              <textarea id="review-comment" class="input" style="height:100px;resize:vertical;" placeholder="What did you think of this prompt?"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" id="submit-review-btn">Submit Review</button>
          </form>
        </div>
        
        <div id="reviews-list" style="display:flex;flex-direction:column;gap:1.5rem;">
          <div style="text-align:center;padding:2rem;color:var(--text-muted);">Loading reviews...</div>
        </div>
      </section>

      <style>
        .star-btn { background: none; border: none; font-size: 1.5rem; color: var(--text-subtle); cursor: pointer; transition: color 0.2s; padding: 0; }
        .star-btn:hover, .star-btn.active { color: #fbbf24; }
        .review-item { padding: 1.5rem; background: rgba(255,255,255,0.02); border-radius: var(--radius-lg); border: 1px solid var(--border); }
        .review-author { display:flex; align-items:center; gap:0.75rem; margin-bottom:1rem; }
        .review-avatar { width:32px; height:32px; border-radius:50%; background:var(--bg-2); display:flex; align-items:center; justify-content:center; font-size:0.8rem; overflow:hidden; border: 1px solid var(--border); }
      </style>
    </div>
  </div>

  <div id="footer-container"></div>
</div>

<!-- Save to Collection Modal -->
<div class="modal-overlay" id="collection-modal" style="display:none; z-index: 1000;">
  <div class="modal-box" style="max-width:480px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;">
      <h3 style="font-size:1.125rem;font-weight:700;color:var(--text);">Save to Collection</h3>
      <button class="modal-close" onclick="document.getElementById('collection-modal').style.display='none'">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    
    <div style="margin-bottom:1.5rem;">
      <label class="label" style="display:block;margin-bottom:0.5rem;">Select Collection</label>
      <div id="collection-list" style="display:flex;flex-direction:column;gap:0.5rem;max-height:200px;overflow-y:auto;margin-bottom:1rem;">
        <!-- Filled by JS -->
        <div style="color:var(--text-muted);font-size:0.875rem;text-align:center;padding:1rem 0;">Loading collections...</div>
      </div>
    </div>
    
    <div style="border-top:1px solid var(--border);padding-top:1.5rem;">
      <label class="label" for="new-col-name" style="display:block;margin-bottom:0.5rem;">Or Create New</label>
      <div style="display:flex;gap:0.5rem;">
        <input type="text" id="new-col-name" class="input" placeholder="e.g. SEO Prompts" style="flex:1;">
        <button id="create-col-btn" class="btn btn-primary">Create</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/js/pages/detail.js"></script>
<script type="module" src="/js/theme.js"></script>
</body>
</html>
