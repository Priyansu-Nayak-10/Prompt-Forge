<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("pf-theme")||"dark");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Generation Tools - PromptForge</title>
  <meta name="description" content="Explore AI image-generation tools supported by PromptForge prompts.">
  <link rel="stylesheet" href="/css/global.css?v=2.0">
  <style>
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }
    .tool-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.125rem;
      display: flex;
      align-items: center;
      gap: 1.125rem;
      text-decoration: none;
      color: inherit;
      transition: border-color var(--transition), background var(--transition), transform var(--transition), box-shadow var(--transition);
      position: relative;
      overflow: hidden;
    }
    .tool-card:hover {
      border-color: rgba(124,77,255,0.3);
      background: var(--card-hover);
      transform: translateY(-2px);
      box-shadow: 0 0 0 1px rgba(124,77,255,0.12), 0 12px 32px rgba(0,0,0,0.45);
    }
    .tool-icon {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: var(--bg-3);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.625rem;
      flex-shrink: 0;
      overflow: hidden;
    }
    .tool-icon img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }
    .tool-info { flex: 1; min-width: 0; }
    .tool-name { font-size: 0.9375rem; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tool-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.2rem; }
    .tool-arrow {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent-subtle);
      border: 1px solid rgba(124,77,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-2);
      flex-shrink: 0;
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity var(--transition), transform var(--transition);
    }
    .tool-card:hover .tool-arrow { opacity: 1; transform: translateX(0); }
    .tools-count { font-size: 0.8125rem; color: var(--text-muted); margin-bottom: 1.25rem; }
  </style>
</head>
<body>
<div class="page-wrap">
  <div id="navbar-container"></div>

  <div class="page-content">
    <div class="container">
      <div class="page-hero">
        <div class="page-hero-eyebrow">Image Models</div>
        <h1>Browse by Image Tool</h1>
        <p>Find prompts tailored for Midjourney, FLUX, Stable Diffusion, Ideogram, DALL-E, Leonardo AI, Firefly, and other image engines.</p>
      </div>

      <div id="tools-count-label" class="tools-count"></div>
      <div class="tools-grid" id="tools-grid"></div>
    </div>
  </div>

  <div id="footer-container"></div>
</div>
<script type="module" src="/js/pages/discovery.js"></script>
<script type="module" src="/js/theme.js?v=3.0"></script>
</body>
</html>
