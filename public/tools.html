<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("pf-theme")||"dark");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tools — PromptForge</title>
  <meta name="description" content="Explore the best AI tools for image generation, text, and video creation.">
  <link rel="stylesheet" href="./css/global.css">
  <style>
    .tool-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      text-decoration: none;
      color: inherit;
      transition: border-color var(--transition), background var(--transition), transform var(--transition), box-shadow var(--transition);
    }
    .tool-card:hover {
      border-color: var(--border-hover);
      background: rgba(108,63,232,0.07);
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(108,63,232,0.12);
    }
    .tool-icon {
      width: 48px; height: 48px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
      overflow: hidden;
    }
    .tool-name { font-size: 0.9375rem; font-weight: 600; color: #fff; }
    .tool-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.25rem; }
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }
  </style>
</head>
<body>
<div class="page-wrap">

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/" class="logo">
        <div class="logo-icon">✨</div>
        Prompt<span>Forge</span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/prompts.html" class="nav-link">Prompts</a>
        <a href="/categories.html" class="nav-link">Categories</a>
        <a href="/tools.html" class="nav-link active">Tools</a>
        <a href="/submit.html" class="nav-cta">Submit</a>
      </div>
        <button class="theme-toggle" aria-label="Toggle theme">
          <svg class="theme-icon-dark" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg class="theme-icon-light" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
    </div>
  </nav>

  <div class="page-content">
    <div class="container">
      <div style="margin-bottom:2rem;">
        <h1 style="font-size:1.75rem;font-weight:800;letter-spacing:-0.03em;">AI Tools</h1>
        <p style="color:var(--text-muted);margin-top:0.4rem;font-size:0.9rem;">Browse prompts compatible with your favorite AI tool.</p>
      </div>

      <div class="tools-grid" id="tools-grid"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <a href="/" class="logo" style="font-size:1rem;">
        <div class="logo-icon" style="width:26px;height:26px;font-size:0.85rem;">✨</div>
        Prompt<span>Forge</span>
      </a>
      <span>© 2026 PromptForge. All rights reserved.</span>
    </div>
  </footer>

</div>
<script type="module">
  const grid = document.getElementById('tools-grid');

  // Skeleton loaders
  grid.innerHTML = Array(6).fill(`
    <div class="tool-card" style="pointer-events:none;">
      <div class="tool-icon"><div class="skeleton" style="width:100%;height:100%;border-radius:8px;"></div></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:0.5rem;">
        <div class="skeleton" style="height:14px;width:55%;"></div>
        <div class="skeleton" style="height:11px;width:40%;"></div>
      </div>
    </div>
  `).join('');

  try {
    const res  = await fetch('/api/tools');
    const json = await res.json();
    const tools = json?.data || [];

    if (!tools.length) {
      grid.innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:5rem 2rem;color:var(--text-muted);">
          <div style="font-size:2.5rem;margin-bottom:1rem;opacity:0.5;">🤖</div>
          <div style="font-weight:600;color:#fff;margin-bottom:0.4rem;">No tools yet</div>
          <div style="font-size:0.875rem;">Tools will appear here once they are added.</div>
        </div>`;
      return;
    }

    grid.innerHTML = tools.map((tool, i) => `
      <a href="/prompts.html?tool=${encodeURIComponent(tool.name)}" class="tool-card animate-fade-up" style="animation-delay:${i * 0.04}s;">
        <div class="tool-icon">
          ${tool.logo_url
            ? `<img src="${tool.logo_url}" alt="${tool.name}" style="width:100%;height:100%;object-fit:contain;padding:0.5rem;">`
            : `<span>🤖</span>`}
        </div>
        <div>
          <div class="tool-name">${tool.name}</div>
          <div class="tool-sub">Browse prompts →</div>
        </div>
      </a>
    `).join('');
  } catch {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:3rem;color:#f87171;">Failed to load tools.</div>`;
  }
</script>
<script type="module" src="./js/theme.js"></script>
</body>
</html>
