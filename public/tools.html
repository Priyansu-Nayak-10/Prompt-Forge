<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("pf-theme")||"dark");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tools — PromptForge</title>
  <meta name="description" content="Explore the best AI tools for image generation, text, and video creation.">
  <link rel="stylesheet" href="/css/global.css">
  <style>
    .tool-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      text-decoration: none;
      color: inherit;
      transition: border-color var(--transition), background var(--transition), transform var(--transition), box-shadow var(--transition);
    }
    .tool-card:hover {
      border-color: var(--border-hover);
      background: var(--bg-2);
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }
    .tool-icon {
      width: 48px; height: 48px;
      border-radius: 10px;
      background: var(--bg-3);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
      overflow: hidden;
    }
    .tool-name { font-size: 0.9375rem; font-weight: 600; color: var(--text); }
    .tool-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.25rem; }
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }
  </style>
</head>
<body>
<div class="page-wrap">

  <div id="navbar-container"></div>

  <div class="page-content">
    <div class="container">
      <div style="margin-bottom:2rem;">
        <h1 style="font-size:1.75rem;font-weight:800;letter-spacing:-0.03em;">AI Tools</h1>
        <p style="color:var(--text-muted);margin-top:0.4rem;font-size:0.9rem;">Browse prompts compatible with your favorite AI tool.</p>
      </div>

      <div class="tools-grid" id="tools-grid"></div>
    </div>
  </div>

  <div id="footer-container"></div>

</div>
<script type="module" src="/js/pages/discovery.js"></script>
<script type="module" src="/js/theme.js"></script>
</body>
</html>
